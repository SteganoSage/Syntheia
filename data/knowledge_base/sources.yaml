# Knowledge-base registry. `python -m notebooks.09a_fetch_sources` reads this,
# downloads each document and writes its sidecar manifest.
#
# Tracked in git; the downloaded documents are not (they are large, and public
# at these URLs). This file plus the fetch script is what makes the corpus
# reproducible -- which §5 effectively requires, since a knowledge base nobody
# can rebuild cannot be version-controlled.
#
# Every URL here returned content when checked with curl on 14 Sep 2026. Entries
# that did not are in `unavailable:` at the bottom, with the reason, because a
# source that failed verification is itself worth recording.

