# Checked 14 Sep 2026 and NOT ingestable. Recorded rather than deleted: a
# source that failed verification is evidence about the corpus, and someone
# will otherwise re-find and re-try these.
unavailable:
  - title: "IRDAI Information and Cyber Security Guidelines, 2023"
    url: https://irdai.gov.in/document-detail?documentId=3314780
    reason: >-
      Fetched and ingested, then removed. The page is a document-detail wrapper:
      240 KB of HTML yielding 18 K of pure site navigation and zero clause ids.
      The guidelines themselves are a linked PDF attachment, so the attachment
      URL is what is needed.
  - title: "Berlin Group — NextGenPSD2 XS2A Framework"
    url: https://www.berlin-group.org/nextgenpsd2-downloads
    reason: >-
      Fetched and ingested, then removed. 1.47 MB of HTML yielding 3.7 K of text
      because it is a downloads *listing*, not the specification. The actual
      OpenAPI files are at gitlab.com/the-berlin-group/nextgenpsd2.
  - title: "NPCI — UPI Product Booklet"
    url: https://www.npci.org.in/PDF/npci/upi/Product-Booklet.pdf
    reason: "403 — bot-blocked even with browser headers."
